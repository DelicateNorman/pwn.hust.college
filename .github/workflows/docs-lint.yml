name: Docs lint
on: [push, pull_request]
jobs:
  markdownlint:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Run markdownlint
        run: npx --yes markdownlint-cli@0.44.0 --config .markdownlint.json -- '**/*.md'
